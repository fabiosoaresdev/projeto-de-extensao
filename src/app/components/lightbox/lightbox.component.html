@if (lightbox.isOpen()) {
  <div class="lightbox-backdrop" (click)="onBackdropClick($event)" role="dialog" aria-modal="true" aria-label="Visualizador de Imagem">
    <button type="button" class="lightbox-close-btn" (click)="lightbox.close()" aria-label="Fechar visualizador">
      <i class="bi bi-x-lg"></i>
    </button>

    <div class="lightbox-container">
      <button type="button" class="lightbox-nav-btn prev" (click)="lightbox.prev(); $event.stopPropagation()" aria-label="Imagem anterior">
        <i class="bi bi-chevron-left"></i>
      </button>

      <div class="lightbox-media-wrapper">
        @if (lightbox.getCurrentItem(); as item) {
          <img [src]="item.src" [alt]="item.alt" class="lightbox-img">
          @if (item.caption) {
            <div class="lightbox-caption">{{ item.caption }}</div>
          }
        }
      </div>

      <button type="button" class="lightbox-nav-btn next" (click)="lightbox.next(); $event.stopPropagation()" aria-label="Próxima imagem">
        <i class="bi bi-chevron-right"></i>
      </button>
    </div>
  </div>
}
