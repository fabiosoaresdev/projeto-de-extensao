<!-- TOPBAR INSTITUCIONAL DCH -->
<div class="dch-topbar d-none d-lg-block">
  <div class="container d-flex justify-content-between align-items-center">
    <div class="dch-topbar-info">
      <span><i class="bi bi-geo-alt-fill"></i> UNEB Campus V | Rua Tenente Coronel Bandeira de Melo, s/n°, Calabar, Santo Antônio de Jesus - BA</span>
    </div>
    <div class="d-flex align-items-center gap-3">
      <span><i class="bi bi-mortarboard-fill text-success"></i> Colegiado de Administração</span>
      <a href="https://dch.saj.uneb.br/" target="_blank" rel="noopener noreferrer" class="text-decoration-none">
        <i class="bi bi-box-arrow-up-right me-1"></i>Portal DCH V
      </a>
    </div>
  </div>
</div>

<!-- NAVBAR PRINCIPAL -->
<header class="sticky-top main-navbar" [class.navbar-scrolled]="isScrolled()">
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <!-- Logo e Identidade DCH -->
      <a class="navbar-brand" href="#inicio">
        <img src="images/logo_uneb.svg" alt="Logo UNEB" class="navbar-brand-logo" width="140" height="52">
        <div class="navbar-brand-text">
          <span class="navbar-brand-title">DCH V · UNEB</span>
          <span class="navbar-brand-subtitle">Departamento de Ciências Humanas</span>
        </div>
      </a>

      <!-- Botão Mobile -->
      <button class="navbar-toggler border-0 shadow-none" type="button" (click)="toggleMobileMenu()" aria-label="Alternar navegação">
        <i class="bi bi-list fs-2 text-primary"></i>
      </button>

      <!-- Menu de Navegação -->
      <div class="collapse navbar-collapse" [class.show]="isMobileMenuOpen()" id="navbarContent">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link" href="#inicio" (click)="closeMobileMenu()">Início</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#sobre" (click)="closeMobileMenu()">O Projeto</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#oficinas" (click)="closeMobileMenu()">Oficinas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#catalogo" (click)="closeMobileMenu()">Catálogo</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#feirantes" (click)="closeMobileMenu()">Quem Faz a Feira</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#galeria" (click)="closeMobileMenu()">Galeria</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#videos" (click)="closeMobileMenu()">Vídeo</a>
          </li>
          <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
            <a href="#catalogo" class="btn btn-success btn-nav-action text-white" (click)="closeMobileMenu()">
              <i class="bi bi-book-half me-1"></i> Ver Catálogo
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
